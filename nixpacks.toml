# Nixpacks a besoin de la toolchain native pour construire better-sqlite3
# (dépendance conservée pour le mode développement local).
[phases.setup]
nixPkgs = ["nodejs_22", "python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
